# Configuración de Nginx para Altikore S.A.S. en Hostinger VPS KVM 2
# Ubicación en el VPS: /etc/nginx/sites-available/altikore
# Habilitar con: sudo ln -s /etc/nginx/sites-available/altikore /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name altikore.com www.altikore.com;

    # Directorio de los archivos estáticos compilados de Vite
    root /var/www/altikore/dist;
    index index.html;

    # Compresión Gzip para máxima velocidad y ahorro de ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache agresivo para assets inmutables de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API de contacto hacia el backend de Node.js en el VPS
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enrutamiento SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueo de acceso a archivos ocultos (.git, .env)
    location ~ /\. {
        deny all;
    }
}
